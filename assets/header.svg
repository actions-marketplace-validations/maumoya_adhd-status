<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1240"/>
      <stop offset="1" stop-color="#3A1670"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5DFC"/>
      <stop offset="1" stop-color="#C04CF0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- mini logo -->
    <rect x="80" y="92" width="72" height="72" rx="18" fill="url(#badge)"/>
    <rect x="94" y="106" width="44" height="44" rx="8" fill="#fff"/>
    <circle cx="104" cy="117" r="5" fill="#22C55E"/><rect x="113" y="114" width="19" height="6" rx="3" fill="#E4E1F7"/>
    <circle cx="104" cy="128" r="5" fill="#3B82F6"/><rect x="113" y="125" width="15" height="6" rx="3" fill="#E4E1F7"/>
    <circle cx="104" cy="139" r="5" fill="#F59E0B"/><rect x="113" y="136" width="17" height="6" rx="3" fill="#F7C873"/>
    <text x="172" y="143" font-size="40" font-weight="700" fill="#FFFFFF">adhd-status</text>

    <text x="80" y="262" font-size="66" font-weight="800" fill="#FFFFFF">Say STATUS.</text>
    <text x="80" y="340" font-size="66" font-weight="800" fill="#C9B8FF">Get one next step.</text>
    <text x="80" y="404" font-size="26" fill="#D8D2F5">An ADHD-friendly status board skill for Claude Code:</text>
    <text x="80" y="440" font-size="26" fill="#D8D2F5">one tiny table, one click, nothing forgotten.</text>

    <g font-size="20" font-weight="600" fill="#1B1240">
      <rect x="80" y="490" width="150" height="40" rx="20" fill="#22C55E"/><text x="155" y="517" text-anchor="middle">zero reading</text>
      <rect x="244" y="490" width="170" height="40" rx="20" fill="#60A5FA"/><text x="329" y="517" text-anchor="middle">one-click next</text>
      <rect x="428" y="490" width="190" height="40" rx="20" fill="#FBBF24"/><text x="523" y="517" text-anchor="middle">nothing forgotten</text>
    </g>

    <!-- mock status card -->
    <g filter="url(#sh)">
      <rect x="720" y="150" width="480" height="340" rx="28" fill="#FFFFFF"/>
    </g>
    <text x="756" y="206" font-size="20" font-weight="700" fill="#8A84A8">TASK</text>
    <text x="946" y="206" font-size="20" font-weight="700" fill="#8A84A8">STATUS</text>
    <line x1="756" y1="224" x2="1164" y2="224" stroke="#ECEAF7" stroke-width="2"/>
    <rect x="740" y="238" width="440" height="64" rx="16" fill="#FFF4D6"/>
    <text x="756" y="280" font-size="24" font-weight="700" fill="#1B1240">Run migration</text>
    <circle cx="958" cy="271" r="13" fill="#F59E0B"/>
    <text x="980" y="280" font-size="22" font-weight="600" fill="#9A5B00">you, ~1 min</text>
    <text x="756" y="350" font-size="24" fill="#1B1240">Rate limit</text>
    <circle cx="958" cy="342" r="13" fill="#EF4444"/>
    <text x="980" y="350" font-size="22" fill="#4A4566">forgotten</text>
    <text x="756" y="412" font-size="24" fill="#1B1240">Signup form</text>
    <circle cx="958" cy="404" r="13" fill="#3B82F6"/>
    <text x="980" y="412" font-size="22" fill="#4A4566">tests running</text>
    <text x="756" y="468" font-size="24" fill="#1B1240">README typo</text>
    <circle cx="958" cy="460" r="13" fill="#22C55E"/>
    <text x="980" y="468" font-size="22" fill="#4A4566">done</text>
    <!-- run button -->
    <rect x="900" y="520" width="300" height="56" rx="28" fill="url(#badge)"/>
    <text x="1050" y="556" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">▶  npm run migrate</text>
  </g>
</svg>
