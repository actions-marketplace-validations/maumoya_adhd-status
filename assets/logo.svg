<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5DFC"/>
      <stop offset="1" stop-color="#C04CF0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2A0E5C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="88" y="104" width="336" height="304" rx="40" fill="#FFFFFF" filter="url(#sh)"/>
  <!-- row 1: done -->
  <circle cx="148" cy="174" r="26" fill="#22C55E"/>
  <path d="M135 175 l9 9 l18 -19" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="194" y="162" width="180" height="24" rx="12" fill="#E4E1F7"/>
  <!-- row 2: running -->
  <circle cx="148" cy="256" r="26" fill="#3B82F6"/>
  <circle cx="136" cy="256" r="5" fill="#fff"/><circle cx="148" cy="256" r="5" fill="#fff"/><circle cx="160" cy="256" r="5" fill="#fff"/>
  <rect x="194" y="244" width="140" height="24" rx="12" fill="#E4E1F7"/>
  <!-- row 3: your turn (highlighted) -->
