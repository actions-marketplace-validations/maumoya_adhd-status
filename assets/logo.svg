  <circle cx="148" cy="344" r="26" fill="#F59E0B"/>
  <path d="M137 344 h20 m-8 -9 l9 9 l-9 9" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="194" y="332" width="160" height="24" rx="12" fill="#F7C873"/>
</svg>
